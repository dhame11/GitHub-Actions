name: demo-workflow
on: workflow_dispatch
jobs:
  demo-job:
    runs-on: ubuntu-latest
    steps:
    - name: demo-step
      run: echo "Running the workflow for the first time"
    - name: to print output of uname command
      run: uname
  second-job:
    runs-on: ubuntu-latest
    needs: demo-job
    steps:
      - name: get the code
        uses: actions/checkout@v7
      - name: install Node js
        uses: actions/setup-node@v7
        with: 
          node-version: 26.8.1
